name: Debug APK build (a14)

on:
  push:
    branches:
      - ci/debug-a14-build
  pull_request:
    branches:
      - a14
  workflow_dispatch:

concurrency:
  group: customiuizer-a14-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare dummy signing config for Gradle configuration
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/../ci-debug.keystore" -storepass ci-debug-password -alias ci-debug -keypass ci-debug-password -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI Debug,O=Customiuizer,C=US"
          cat > "$GITHUB_WORKSPACE/../keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/../ci-debug.keystore
          storePassword=ci-debug-password
          keyAlias=ci-debug
          keyPassword=ci-debug-password
          EOF
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: customiuizer-a14-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
